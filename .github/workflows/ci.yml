name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job starts with read-only access; the jobs that publish ask for more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Trivy, the image scanner, pinned by digest.
  TRIVY: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

# Third-party actions are pinned to full commit SHAs (the tag is in the comment);
# Dependabot keeps them up to date.
jobs:
  test:
    name: ${{ matrix.lang }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lang: Python, exe: python3 python/hocuspocus.py }
          - { lang: JavaScript, exe: node javascript/hocuspocus.js }
          - { lang: TypeScript, exe: node typescript/hocuspocus.ts }
          - { lang: Go, exe: go run go/hocuspocus.go }
          - { lang: Rust, build: rustc -O rust/hocuspocus.rs -o hocuspocus, exe: ./hocuspocus }
          - { lang: C, build: cc -std=c99 -Wall -Wextra -Werror -O2 c/hocuspocus.c -o hocuspocus, exe: ./hocuspocus }
          - { lang: C++, build: c++ -std=c++17 -Wall -Wextra -Werror -O2 cpp/hocuspocus.cpp -o hocuspocus, exe: ./hocuspocus }
          - { lang: C#, build: dotnet build csharp -c Release -o out, exe: dotnet out/HocusPocus.dll }
          - { lang: Java, exe: java java/HocusPocus.java }
          - { lang: Kotlin, build: kotlinc kotlin/hocuspocus.kt -include-runtime -d hocuspocus.jar, exe: java -jar hocuspocus.jar }
          - { lang: Ruby, exe: ruby ruby/hocuspocus.rb }
          - { lang: Lua, exe: lua5.4 lua/hocuspocus.lua }
          - { lang: Perl, exe: perl perl/hocuspocus.pl }
          - { lang: Bash, exe: bash bash/hocuspocus.sh }
          - { lang: PowerShell, exe: pwsh powershell/hocuspocus.ps1 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.lang == 'JavaScript' || matrix.lang == 'TypeScript'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - if: matrix.lang == 'Go'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable

      - if: matrix.lang == 'Java' || matrix.lang == 'Kotlin'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - if: matrix.lang == 'Kotlin'
        name: Install Kotlin compiler (checksum verified)
        run: |
          curl -sSLo kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip
          echo "7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd  kotlin.zip" | sha256sum -c -
          unzip -q kotlin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"

      - if: matrix.lang == 'Lua'
        run: sudo apt-get update -q && sudo apt-get install -yq lua5.4

      - if: matrix.build
        name: Build
        run: ${{ matrix.build }}

      - name: Self-test (1,000 simulated games)
        run: ${{ matrix.exe }} --test

      - name: Play one game from piped answers
        run: |
          out=$(printf '1\n2\n3\n' | ${{ matrix.exe }})
          echo "$out" | tail -3
          echo "$out" | grep -q "Hocus pocus... your card is the "

  docker:
    name: Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan the Dockerfiles for misconfigurations
        run: docker run --rm -v "$PWD:/src:ro" "$TRIVY" config --quiet --exit-code 1 --severity MEDIUM,HIGH,CRITICAL /src

      - name: Build every image
        run: docker compose --profile cli build

      - name: Check no image runs as root
        run: |
          for image in $(docker compose --profile cli config --images); do
            user=$(docker image inspect -f '{{.Config.User}}' "$image")
            case "${user%%:*}" in
              ""|0|root) echo "::error::$image runs as root"; exit 1 ;;
            esac
            echo "$image runs as $user"
          done

      - name: Check the container lock-down
        run: |
          docker compose run --rm -T --entrypoint bash bash -c '
            fail() { echo "::error::$1"; exit 1; }
            [ "$(id -u)" != 0 ] || fail "running as root"
            grep -Eq "^CapEff:\s+0+$" /proc/self/status || fail "has Linux capabilities"
            grep -Eq "^NoNewPrivs:\s+1$" /proc/self/status || fail "can gain privileges"
            if touch /app/probe 2>/dev/null; then fail "filesystem is writable"; fi
            if (exec 3<>/dev/tcp/1.1.1.1/443) 2>/dev/null; then fail "has network access"; fi
            echo "non-root, no capabilities, no new privileges, read-only, no network"'

      - name: Self-test each language inside its image
        run: |
          for lang in $(docker compose --profile cli config --services); do
            case $lang in site|node-web|python-web) continue ;; esac
            echo "::group::$lang"
            docker compose run --rm -T "$lang" --test
            printf '1\n2\n3\n' | docker compose run --rm -T "$lang" | grep "your card is the"
            echo "::endgroup::"
          done

      - name: Play the web server images
        run: |
          docker compose up -d --wait node-web python-web site
          sleep 3
          python3 tools/test_web_server.py http://127.0.0.1:3000 50
          python3 tools/test_web_server.py http://127.0.0.1:8000 50
          curl -fsS http://127.0.0.1:8080/web/angular/ | grep -q app-root
          for port in 3000 8000 8080; do
            curl -fsSI "http://127.0.0.1:$port/" | grep -qi '^content-security-policy:'
          done
          docker compose down

      - name: Scan the images for known vulnerabilities
        run: |
          for image in $(docker compose --profile cli config --images); do
            echo "::group::$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache "$TRIVY" \
              image --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$image"
            echo "::endgroup::"
          done

  web:
    name: Web versions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build Angular, React and Vue
        run: |
          for app in angular react vue; do
            npm ci --prefix web/$app --ignore-scripts --no-audit --no-fund
            npm audit --prefix web/$app --omit=dev --audit-level=high
            npm run build --prefix web/$app
          done

      - name: Assemble the site
        run: |
          python3 tools/build_site.py --strict
          node --check _site/hub.js
          node --check _site/web/vanilla/app.js
          ! grep -l '<script>' _site/index.html _site/web/*/index.html

      - name: Play the Node.js and Python servers
        run: |
          node web/node/server.js &
          python3 web/python/server.py &
          sleep 2
          python3 tools/test_web_server.py http://127.0.0.1:3000 50
          python3 tools/test_web_server.py http://127.0.0.1:8000 50

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  publish:
    name: Publish signed images
    needs: [test, docker, web]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to ghcr.io/dascondor/polyhocuspocus
      id-token: write # keyless signing with Sigstore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push, with an SBOM and build provenance
        run: |
          docker buildx bake -f compose.yaml --push \
            --set '*.attest=type=sbom' \
            --set '*.attest=type=provenance,mode=max' \
            --metadata-file bake.json

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Sign every image
        run: |
          jq -r '.[] | objects | select(.["containerimage.digest"])
                 | (.["image.name"] | split(",")[0] | split(":")[0]) + "@" + .["containerimage.digest"]' bake.json \
            | sort -u | while read -r ref; do
              echo "Signing $ref"
              cosign sign --yes "$ref"
            done

  deploy:
    needs: [test, docker, web]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
