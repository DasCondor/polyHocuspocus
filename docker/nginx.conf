# nginx for the website image. Runs as a non-root user on port 8080 and only
# writes to /tmp, so the container can run with a read-only filesystem.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;
  charset_types text/css application/javascript application/json image/svg+xml;
  access_log /dev/stdout;
  sendfile on;

  server_tokens off;            # no nginx version in headers or error pages
  client_max_body_size 1k;      # the site only answers GET requests
  client_header_timeout 10s;
  client_body_timeout 10s;
  keepalive_timeout 15s;
  send_timeout 10s;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    disable_symlinks on;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location / {
      limit_except GET { deny all; }  # GET also allows HEAD
      try_files $uri $uri/ =404;
    }

    location ~ /\. { deny all; }      # never serve dotfiles
  }
}
